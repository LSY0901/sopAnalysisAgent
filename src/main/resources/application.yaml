server:
  port: 9003

spring:
  application:
    name: SopAnalysisAgent
  datasource:
    url: jdbc:postgresql://localhost:5432/agent_db?options=-c%20search_path%3Dagent%2Cpublic
    username: agent_user
    password: 123456

agentscope:
  openai:
    api-key: sk-xxxxxx
    base-url: https://api.deepseek.com
    model-name: deepseek-v4-pro
  agent:
    name: sop-analysis-agent
  a2a:
    server:
      enabled: true
      card:
        name: SOP Analysis Agent
        description: SOP 问答与工单助手（rewrite → retrieve → answer）

sop:
  agent:
    temperature: 0.2
    workspace: .agentscope/workspace

mes:
  base-url: http://localhost:0
erp:
  base-url: http://localhost:0

rag:
  base-url: http://localhost:8000
  top-k: 5
  # Python /search 含 embedding+rerank，冷启动常 >5s；过短会误杀预检索
  response-timeout-seconds: 30

logging:
  level:
    org.example.sopanalysisagent: DEBUG
    io.agentscope: INFO

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    mapper-locations: classpath:/mapper/*.xml
